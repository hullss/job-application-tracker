spring.application.name=Job Application Tracker

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/job_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:job_tracker}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:job_tracker_dev_password}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=PT24H
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.ai.gemini.base-url=https://generativelanguage.googleapis.com
app.ai.gemini.timeout=PT15S